<!DOCTYPE html>
<html>
    <head>
        <title>css grid </title>
        <style>
            
            *{
                padding: 0;
                margin:0;
                box-sizing:border-box;
                gap:10px;
            }
            .parent{
                text-align: center;
                color: white;
                display: grid;
                height: 100vh;
                grid-template-rows:  25% 25% 25% 25%;
                grid-template-columns: 15% 40% 45%;
            }
            .header{
                background-color: gray;
                grid-column: 1/4;
                grid-row: 1/2; 
            }
            .sidebar{
                background-color: black;
                grid-colunm: 2/2;
                grid-row: 2/4;
            }
             .content1{
                background-color: green;
                grid-column: 2/4;
                grid-row:2/3;
             }
             .content2{
                background-color: red;
                grid-column: 2/3;
                grid-row:3/4;
             }
             .content3{
                background-color: yellowgreen;
                grid-column:3/4;
                grid-row:3/4;
             }
             .fotter{
                background-color: gray;
                grid-column:1/4;
                grid-row:4/5;
             }
            
        </style>
    </head>
    <body>
          <div class="parent">
            <div class="header">header</div>
            <div class="sidebar">sidebar</div>
            <div class="content1 ">content1</div>
            <div class="content2">content2</div>
            <div class="content3">content3</div>
            <div class="fotter">fotter</div>
        </div>
    </body>
</html>
