<!DOCTYPE html>
<html>
    <head>
        <title> CSS grid</title>
        <style>
            .*{
                padding: 0;
                margin: 0;
                 box-sizing:border-box;
                        }
                .parent{
                 text-align: center;
                 color: black;
                 display: grid;
                 height:100vh;
                 grid-template-columns: 30% 35% 35%;
                 grid-template-rows: 20% 20% 20% 20% 20% ;
                        gap:5px;
                }
                .A{
                 background-color:blue;
                 grid-column:1/6;
                 grid-row:1/2;
                }
                .B{
                    background-color:pink;
                    grid-column:1/2;
                    grid-row:2/2;
                }
                .C{
                    background-color: aqua;
                    grid-column: 2/3;
                    grid-row: 2/4;
                }
                .D{
                    background-color: blueviolet;
                    grid-column:3/3;
                    grid-row:2/3 ; 
                }
                .E{
                    background-color: cadetblue;
                    grid-column:1/2 ;
                    grid-row:3/5;
                }
                .F{
                    background-color: burlywood;
                    grid-column: 3/3;
                    grid-row:3/4;
                }
                .G{
                    background-color: brown;
                    grid-column: 2/4;
                    grid-row: 4/5;
                }
                .H{
                    background-color: chocolate;
                    grid-column: 1/3;
                    grid-row: 5/5;
                }
                .I{
                    background-color: crimson;
                    grid-column:3/4 ;
                    grid-row:5/5;
                }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="A">A</div>
             <div class="B">B</div>
              <div class="C">C</div>
               <div class="D">D</div>
                <div class="E">E</div>
                 <div class="F">F</div>
                  <div class="G">G</div>
                   <div class="H">H</div>
                    <div class="I">I</div>
        </div>
    </body>
</html>
