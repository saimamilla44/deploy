 <!DOCTYPE html>
 <html>
<head>
    <title>Grid Example</title>

    <style>

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial;
        }

        .container{
            display:grid;
            grid-template-columns:50px 80px 80px 80px;
            grid-template-rows:30px 80px 80px 80px;
            gap:0px;
        }

        .head{
            text-align:center;
            font-size:14px;
            padding-top:5px;
        }

        .side{
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:14px;
        }

        .box{
            border:1px solid #8fa3c7;
            background-color:#c7d4ee;
        }

    </style>
</head>

<body>

    <div class="container">

        <div></div>
        <div class="head">Col 1</div>
        <div class="head">Col 2</div>
        <div class="head">Col 3</div>

        <div class="side">Row 1</div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

        <div class="side">Row 2</div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

        <div class="side">Row 3</div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

    </div>

</body>
</html>
