<!DOCTYPE html>
<html>
<head>
    <title>gridd</title>

    <style>

        .parent{
            display:grid;
            grid-template-columns:2fr 2fr 2fr 2fr 2fr;
            grid-template-rows:2fr 2fr 2fr;
            height:100vh;
            gap:5px;
            background-color: black;
        }

        .red{
            background-color:red;
            grid-column:1/2;
            grid-row:1/3;
        }

        .blue{
            background-color:rgb(0, 213, 255);
            grid-column:2/4;
            grid-row:1;
        }

        .green{
            background-color:rgb(210, 180, 100);
            grid-column:4/6;
            grid-row:1;
        }

        .white{
            background-color:white;
            grid-column:1/2;
            grid-row:3;
        }

        .orange{
            background-color:rgb(210, 180, 100);
            grid-column:2/3;
            grid-row:2;
        }

        .brown{
            background-color:rgb(240,240,240);
            grid-column:3/5;
            grid-row:2;
        }

        .vilote{
            background-color:red;
            grid-column:5/6;
            grid-row:2/4;
        }

        .pink{
            background-color:red;
            grid-column:2/4;
            grid-row:3;
        }

        .gray{
            background-color:rgb(0, 213, 255);
            grid-column:4/5;
            grid-row:3;
        }

    </style>
</head>

<body>

    <div class="parent">

        <div class="red"></div>
        <div class="blue"></div>
        <div class="green"></div>

        <div class="white"></div>
        <div class="orange"></div>
        <div class="brown"></div>
        <div class="vilote"></div>

        <div class="pink"></div>
        <div class="gray"></div>

    </div>

</body>
</html>
